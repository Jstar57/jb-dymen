<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login Admin - Dymen Point</title>
    <link rel="stylesheet" href="jb.css">
    <style>
        .login-container {
            max-width: 400px;
            margin: 80px auto;
            padding: 30px;
            background: #11141a;
            border: 2px solid var(--primary-tosca);
            border-radius: 8px;
        }
        .form-group {
            margin-bottom: 20px;
        }
        .form-group label {
            display: block;
            color: var(--white);
            margin-bottom: 8px;
            font-weight: bold;
        }
        .form-group input {
            width: 100%;
            padding: 12px;
            background: transparent;
            border: 2px solid var(--primary-tosca);
            border-radius: 5px;
            color: var(--white);
            font-size: 1rem;
            outline: none;
        }
        .btn-login {
            background-color: var(--primary-tosca);
            color: var(--bg-color);
            padding: 12px;
            border: none;
            border-radius: 5px;
            font-size: 1rem;
            font-weight: bold;
            cursor: pointer;
            width: 100%;
            transition: 0.3s;
        }
        .btn-login:hover {
            background-color: var(--light-tosca);
        }
        #loginError {
            color: #ff3333;
            text-align: center;
            margin-bottom: 15px;
            font-weight: bold;
        }
    </style>
</head>
<body>

    <div class="login-container">
        <h2 class="section-title" style="text-align: center; margin-bottom: 20px;">LOGIN ADMIN</h2>
        <div id="loginError"></div>
        <form id="loginForm">
            <div class="form-group">
                <label>Email Admin</label>
                <input type="email" id="adminEmail" required placeholder="admin@dymenpoint.com">
            </div>
            <div class="form-group">
                <label>Password</label>
                <input type="password" id="adminPassword" required placeholder="••••••••">
            </div>
            <button type="submit" class="btn-login" id="loginBtn">Masuk as Admin</button>
        </form>
    </div>

    <!-- Panggil Supabase JS -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script>
        const SUPABASE_URL = 'https://hhpdzobytbirrttqvwka.supabase.co';
        const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImhocGR6b2J5dGJpcnJ0dHF2d2thIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODYxMDM4MzQsImV4cCI6MjEwMTY3OTgzNH0.WA2ztplgz3zOsUsm4R9m8YBY0naqEBtHC0VNtOKwIYw';
        const supabase = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        const loginForm = document.getElementById('loginForm');
        const loginError = document.getElementById('loginError');

        loginForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            loginError.textContent = "";
            
            const email = document.getElementById('adminEmail').value;
            const password = document.getElementById('adminPassword').value;

            document.getElementById('loginBtn').disabled = true;
            document.getElementById('loginBtn').textContent = "Memeriksa...";

            // Proses Login ke Supabase Auth
            const { data, error } = await supabase.auth.signInWithPassword({
                email: email,
                password: password,
            });

            if (error) {
                loginError.textContent = "Login Gagal: Email atau Password salah!";
                document.getElementById('loginBtn').disabled = false;
                document.getElementById('loginBtn').textContent = "Masuk as Admin";
            } else {
                // Jika sukses, arahkan kembali ke index.html
                window.location.href = 'index.html';
            }
        });
    </script>
</body>
</html>
