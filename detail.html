<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Detail Akun - Dymen Point</title>
    <link rel="stylesheet" href="jb.css">
    <style>
        .detail-container {
            max-width: 900px;
            margin: 40px auto;
            padding: 20px;
            background: #11141a;
            border: 2px solid var(--primary-tosca);
            border-radius: 8px;
        }
        /* Slider Foto */
        .slider-container {
            position: relative;
            width: 100%;
            height: 400px;
            background: #000;
            border-radius: 6px;
            overflow: hidden;
            margin-bottom: 20px;
        }
        .slider-images {
            display: flex;
            width: 100%;
            height: 100%;
            transition: transform 0.4s ease-in-out;
        }
        .slider-images img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            flex-shrink: 0;
        }
        .slider-btn {
            position: absolute;
            top: 50%;
            transform: translateY(-50%);
            background: rgba(0, 128, 128, 0.7);
            color: white;
            border: none;
            padding: 10px 15px;
            cursor: pointer;
            font-weight: bold;
            border-radius: 4px;
            z-index: 10;
        }
        .prev-btn { left: 10px; }
        .next-btn { right: 10px; }
        
        .thumbnail-container {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
            overflow-x: auto;
        }
        .thumbnail-container img {
            width: 80px;
            height: 60px;
            object-fit: cover;
            border-radius: 4px;
            cursor: pointer;
            opacity: 0.6;
            border: 1px solid var(--primary-tosca);
            transition: 0.3s;
        }
        .thumbnail-container img.active, .thumbnail-container img:hover {
            opacity: 1;
            border-color: var(--white);
        }
        
        .account-info h1 {
            color: var(--white);
            font-size: 1.8rem;
            margin-bottom: 10px;
        }
        .account-price {
            color: #00ffcc;
            font-size: 1.5rem;
            font-weight: bold;
            margin-bottom: 20px;
        }
        .account-desc {
            color: #a0a5b5;
            line-height: 1.6;
            margin-bottom: 30px;
            white-space: pre-line;
        }
        .btn-buy-now {
            display: block;
            width: 100%;
            text-align: center;
            background-color: var(--primary-tosca);
            color: var(--bg-color);
            padding: 15px;
            font-size: 1.2rem;
            font-weight: bold;
            text-decoration: none;
            border-radius: 6px;
            transition: 0.3s;
        }
        .btn-buy-now:hover {
            background-color: var(--light-tosca);
        }
    </style>
</head>
<body>

    <header>
        <nav class="navbar">
            <div class="logo-container">
                <div class="logo">DYMEN <span>POINT</span></div>
            </div>
            <ul class="nav-links">
                <li><a href="index.html">Home</a></li>
            </ul>
        </nav>
    </header>

    <div class="detail-container" id="detailContainer">
        <p style="color: var(--primary-tosca); text-align: center;">Memuat detail akun...</p>
    </div>

    <!-- Panggil Supabase SDK -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="detail.js"></script>
</body>
</html>
